<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мобильная версия</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #223A5E; --ink-2: #4a6080; --bg: #e9f0f9; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 "Onest", system-ui, sans-serif; padding: 40px 16px 64px; }
  header { max-width: 1500px; margin: 0 auto 32px; }
  h1 { margin: 0; font-size: clamp(26px, 4vw, 40px); letter-spacing: -.02em; }
  header p { margin: 6px 0 0; color: var(--ink-2); }
  .grid { max-width: 1500px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(384px, 1fr)); gap: 40px 24px; justify-items: center; }
  figure { margin: 0; display: grid; gap: 12px; justify-items: center; }
  .phone { width: 384px; height: 804px; padding: 12px; border-radius: 56px; background: #1b2a40; box-shadow: 0 30px 60px -30px rgba(34,58,94,.6), inset 0 0 0 2px #2c3f5c; position: relative; }
  iframe { width: 360px; height: 780px; border: 0; border-radius: 44px; background: #f3f8fd; display: block; }
  figcaption { text-align: center; }
  figcaption b { display: block; }
  figcaption span { color: var(--ink-2); font-size: 13px; }
  @media (max-width: 420px) { .grid { grid-template-columns: 1fr; } .phone { transform: scale(.86); transform-origin: top center; margin-bottom: -110px; } }
</style>
</head>
<body>
<header>
  <h1>Личный кабинет на телефоне</h1>
  <p>Каждый экран — живой прототип шириной 360 px, в нём можно нажимать.</p>
</header>
<main class="grid" id="grid"></main>
<script>
  const SCREENS = [
    ['', 'Вход', 'Вход по демонстрационному логину и паролю'],
    ['home', 'Главная', 'Часы, следующая пара, поиск'],
    ['search:баз', 'Поиск', 'Предметы, преподаватели, справки'],
    ['schedule', 'Расписание · день', 'Лента недели, пары и перерывы'],
    ['lesson', 'Карточка пары', 'Время, аудитория, преподаватель'],
    ['schedule:2', 'Расписание · неделя', 'Список дней'],
    ['schedule:1', 'Расписание · месяц', 'Точки — пары в этот день'],
    ['study', 'Успеваемость', 'Рейтинг, посещаемость, баллы с рекомендациями'],
    ['inbox', 'Мессенджер', 'Чаты и поиск преподавателей и студентов'],
    ['inbox:dean', 'Чат с деканатом', 'Пузыри, скрепка, отправка'],
    ['inbox:news', 'Новости', 'Новости и напоминания'],
    ['inbox:events', 'Мероприятия', 'Доска событий вуза и совместных'],
    ['profile', 'Профиль', 'Билет, заявления и справки, три окна данных'],
    ['docs', 'Документы', 'Три кнопки и мои заявки'],
    ['docs:app', 'Подать заявление', 'Стеклянное окно с поиском'],
    ['docs:archive', 'Архив', 'Ранее выданные справки'],
    ['docs:order', 'Заказ справки', 'Окно по центру, форма раскрыта'],
    ['settings', 'Настройки', 'Внешний вид, безопасность, уведомления'],
    ['access', 'Универсальный доступ', 'Порядок, иконки и скрытие пунктов дока'],
  ];
  // в собранной витрине сайт встроен (APP_HTML), в исходниках берётся соседний index.html
  const page = window.APP_HTML ? URL.createObjectURL(new Blob([APP_HTML], { type: 'text/html' })) : 'index.html';
  document.getElementById('grid').innerHTML = SCREENS.map(([h, t, d]) =>
    `<figure><div class="phone"><iframe src="${page}${h ? '#' + h : ''}" title="${t}" loading="lazy"></iframe></div><figcaption><b>${t}</b><span>${d}</span></figcaption></figure>`).join('');
  document.querySelectorAll('iframe').forEach((frame, i) => {
    if (!SCREENS[i][0]) return;
    frame.addEventListener('load', () => {
      const form = frame.contentDocument?.getElementById('loginForm');
      if (!form) return;
      form.elements.login.value = 'student';
      form.elements.password.value = 'lk-demo-2026';
      form.requestSubmit();
    });
  });
</script>
</body>
</html>
