sk\"), low = CURRENT.filter(c=>c.ctrl!==\"Зачёт\" && sumOf(c) + c.comps.filter(x=>x[1]==null).reduce((s,x)=>s+x[2],0) < 76);\n  const bad = [...new Set([...risk, ...low])];\n  return `<section class=\"card\"><div class=\"card-h\"><h2>Стипендия<\/h2><span class=\"chip ok\">Назначена<\/span><\/div>\n    <div class=\"kv\"><dt>Вид<\/dt><dd>Академическая, «хорошо» и «отлично»<\/dd><dt>Размер<\/dt><dd class=\"mono\">3 400 ₽ в месяц<\/dd><dt>Условие<\/dt><dd>Сдать сессию без троек и в срок<\/dd>\n      <dt>Прогноз<\/dt><dd>${bad.length ? `<span style=\"color:var(--alert)\">Под угрозой: ${bad.map(c=>esc(c.s)).join(\", \")}<\/span>` : \"Сохраняется, если сдать сессию по текущему темпу\"}<\/dd><\/div>\n  <\/section>`;\n}\n/* ===== рейтинг и посещаемость ===== */\nfunction ratingRing(){\n  const all = Object.values(RECORD).flat(), avg = Math.round(recordAvg()), C = 2*Math.PI*52;\n  const cnt = k => all.filter(([,c,b])=>markOf(b,c)[0]===k).length;\n  const parts = [[\"отлично\",\"m5\"],[\"хорошо\",\"m4\"],[\"удовл.\",\"m3\"],[\"зачтено\",\"m5\"]].map(([k,m])=>[k,m,cnt(k)]).filter(x=>x[2]);\n  return `<section class=\"card gr-ring\" aria-label=\"Средний балл ${avg} из 100\">\n    <div class=\"ring\"><svg viewBox=\"0 0 132 132\" aria-hidden=\"true\"><defs><linearGradient id=\"rg\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"var(--h3)\"/><stop offset=\"1\" stop-color=\"var(--h1)\"/><\/linearGradient><\/defs>\n      <circle cx=\"66\" cy=\"66\" r=\"52\" class=\"rt\"/><circle cx=\"66\" cy=\"66\" r=\"52\" class=\"ra\" style=\"--c:${C.toFixed(1)};--o:${(C*(1-avg/100)).toFixed(1)}\" stroke-dasharray=\"${C.toFixed(1)}\" stroke-dashoffset=\"${(C*(1-avg/100)).toFixed(1)}\"/><\/svg>\n      <div class=\"ring-c\"><b>${avg}<\/b><span>из 100<\/span><\/div><\/div>\n    <div class=\"ring-side\"><div><small>Средний балл зачётки<\/small><b>${markOf(avg,\"Экзамен\")[0]}<\/b><\/div>\n      <div class=\"ring-marks\">${parts.map(([k,m,n])=>`<span><i class=\"mark-cell ${m}\">${n}<\/i>${k}<\/span>`).join(\"\")}<\/div><\/div>\n  <\/section>`;\n}\nfunction attendance(){\n  const ATT = CURRENT.map(c=>c.comps.find(x=>x[0]===\"Посещение\")).filter(Boolean);\n  const got = ATT.reduce((n,x)=>n+x[1],0), all = ATT.reduce((n,x)=>n+x[2],0), missed = all - got;\n  const start = new Date(2026,7,31), end = new Date(2026,11,27), t0 = now(); t0.setHours(0,0,0,0);\n  const HOL = [\"2026-11-04\"], days = [];\n  for(let d = new Date(start); d < end; d.setDate(d.getDate()+1)){ const wd = d.getDay(); if(wd===0) continue;\n    const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,\"0\")}-${String(d.getDate()).padStart(2,\"0\")}`;\n    days.push({d:new Date(d), iso, n: d < new Date(2026,8,1) || HOL.includes(iso) ? 0 : (SCHEDULE[wd]||[]).length, past: d <= t0, miss:0}); }\n  // пропуски раскладываются по прошедшим дням детерминированно, чтобы сумма совпала с баллами за посещение\n  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;\n  const past = days.filter(x=>x.past && x.n); for(let k=0; k<missed && past.length; ){ const x = past[Math.floor(rnd()*past.length)]; if(x.miss < x.n){ x.miss++; k++; } }\n  const weeks = Math.ceil(days.length/6), MN = [\"сен\",\"окт\",\"ноя\",\"дек\"];\n  const cells = days.map(x=>{ const lvl = !x.n ? \"e\" : !x.past ? \"f\" : x.miss===x.n ? \"m\" : x.miss ? \"p\" : \"a\" + Math.min(4, x.n);\n    const lab = `${x.d.getDate()} ${MONS[x.d.getMonth()]}: ${!x.n?\"занятий нет\":!x.past?`${x.n} ${plural(x.n,\"пара\",\"пары\",\"пар\")} впереди`:`${x.n-x.miss} из ${x.n} ${plural(x.n,\"пары\",\"пар\",\"пар\")}`}`;\n    return `<i class=\"${lvl}\" title=\"${lab}\"><\/i>`; }).join(\"\");\n  const monthCols = [0,1,2,3].map(m=>{ const first = days.findIndex(x=>x.d.getMonth()===8+m && x.d.getDate()>=1); return `<span style=\"grid-column:${Math.floor(first/6)+1}\">${MN[m]}<\/span>`; }).join(\"\");\n  return `<section class=\"card gr-att\"><div class=\"card-h\"><h2>Посещаемость<\/h2><b class=\"gr-pct\">${Math.round(got/all*100)} %<\/b><\/div>\n    <div class=\"hm-wrap\" style=\"--w:${weeks}\"><div class=\"hm-m\" style=\"--w:${weeks}\">${monthCols}<\/div>\n      <div class=\"hm\" style=\"--w:${weeks}\" role=\"img\" aria-label=\"Посещаемость по дням: пропущено ${missed} из ${all} занятий\">${cells}<\/div><\/div>\n    <div class=\"hm-leg\"><span>Пропущено ${missed} из ${all} занятий<\/span><span class=\"hm-key\"><i class=\"m\"><\/i>пропуск<i class=\"p\"><\/i>частично<i class=\"a3\"><\/i>все пары<\/span><\/div>\n  <\/section>`;\n}\n\nfunction vGrades(){\n  const avg = recordAvg();\n  const risks = CURRENT.filter(c=>c.status===\"risk\").length;\n  const auto = CURRENT.filter(c=>c.status===\"auto\"||c.status===\"done\").length;\n  const sessionDays = daysTo(\"2026-12-21\");\n  let body;\n  if(S.gradeTab===\"now\"){\n    body = `<div style=\"display:grid;gap:10px\">${CURRENT.map(subjCard).join(\"\")}<\/div>`;\n  } else if(S.gradeTab===\"session\"){\n    const exams = CURRENT.slice().sort((a,b)=>a.date.localeCompare(b.date));\n    body = `<section class=\"card\">\n      <div class=\"session\"><span class=\"big\">${Math.max(0,sessionDays)}<\/span><div><b>${plural(sessionDays,\"день\",\"дня\",\"дней\")} до зачётной недели<\/b><\/div><\/div>\n      <div class=\"timeline\">${exams.map(c=>{ const d=new Date(c.date); return `<div class=\"r\"><span class=\"mono small\">${d.getDate()} ${MONS[d.getMonth()]}, ${DOW[d.getDay()]}<\/span><span style=\"min-width:0\">${esc(c.s)}<\/span><span class=\"chip ${c.ctrl===\"Экзамен\"?\"accent\":\"\"}\">${c.ctrl}<\/span><\/div>`; }).join(\"\")}<\/div>\n    <\/section>\n    ${STUDENT.funding===\"budget\" ? scholarship() : \"\"}`;\n  } else {\n    const rows = RECORD[S.sem];\n    body = `<div class=\"seg\" role=\"group\" aria-label=\"Семестр\">${[1,2,3,4].map(n=>`<button data-action=\"sem\" data-n=\"${n}\" aria-pressed=\"${S.sem===n}\">${n} семестр<\/button>`).join(\"\")}<\/div>\n      <section class=\"card\" style=\"overflow-x:auto\"><table class=\"record\"><thead><tr><th>Дисциплина<\/th><th>Форма<\/th><th>Баллы<\/th><\/tr><\/thead><tbody>\n      ${rows.map(([n,f,b])=>{ const [w,m] = markOf(b,f); return `<tr><td>${esc(n)}<\/td><td class=\"muted\">${f}<\/td><td class=\"rec-b\"><span class=\"mark-cell ${m}\">${b}<\/span><span class=\"muted small\">${w}<\/span><\/td><\/tr>`; }).join(\"\")}\n      <\/tbody><\/table><\/section>`;\n  }\n  return `<div class=\"view\">\n    ${pageH(\"Успеваемость\")}\n    <h2 class=\"gr-title\">Рейтинг<\/h2>\n    <div class=\"gr-top\">${ratingRing()}${attendance()}<\/div>\n    <p class=\"gr-sem\">5 семестр · 2026/27<\/p>\n    <div class=\"seg gr-seg\" role=\"group\" aria-label=\"Раздел\">\n      <button data-action=\"gtab\" data-t=\"now\" aria-pressed=\"${S.gradeTab===\"now\"}\">Баллы<\/button>\n      <button data-action=\"gtab\" data-t=\"session\" aria-pressed=\"${S.gradeTab===\"session\"}\">Сессия<\/button>\n      <button data-action=\"gtab\" data-t=\"record\" aria-pressed=\"${S.gradeTab===\"record\"}\">Зачётка<\/button>\n    <\/div>\n    ${body}\n  <\/div>`;\n}\n\nfunction reqCard(r){\n  const steps = STEPS.map((_,i)=>`<i class=\"${i<r.step?\"on\":i===r.step?(r.step===3||r.step===2?\"on\":\"cur\"):\"\"}\"><\/i>`).join(\"\");\n  const labels = STEPS.map((s,i)=>`<span class=\"${i===r.step?\"on\":\"\"}\">${s}<\/span>`).join(\"\");\n  const stChip = r.step===2 ? '<span class=\"chip ok\">Готова<\/span>' : r.step===3 ? '<span class=\"chip\">Получена<\/span>' : r.step===1 ? '<span class=\"chip warn\">В работе<\/span>' : '<span class=\"chip accent\">Подана<\/span>';\n  return `<article class=\"req\">\n    <div class=\"top\"><div style=\"min-width:0\"><h3>${esc(r.t)}<\/h3><p class=\"muted small\">${esc(r.sub)}<\/p><\/div>${stChip}<\/div>\n    <div style=\"display:grid;gap:6px\"><div class=\"steps\">${steps}<\/div><div class=\"steplabels\">${labels}<\/div><\/div>\n    <div class=\"row small\"><span class=\"grow muted\">№ <span class=\"mono\">${r.id}<\/span> · от ${fmtDate(new Date(r.date))}<\/span><\/div>\n    ${r.info?`<p class=\"small\">${esc(r.info)}<\/p>`:\"\"}\n    ${r.doc&&r.step>=2?`<div class=\"row\" style=\"gap:8px;flex-wrap:wrap\"><button class=\"btn sm\" data-action=\"doc\" data-id=\"${r.id}\">${ic(\"doc\",\"i s\")}Открыть справку<\/button><button class=\"btn sm ghost\" data-action=\"copylink\" data-id=\"${r.id}\">Скопировать код проверки<\/button><\/div>`:\"\"}\n  <\/article>`;\n}\nconst kindOf = r => (CATALOG.find(c=>c.t===r.t)||{}).app ? \"app\" : \"cert\";\nconst PICK = {\n  cert: {title:\"Заказ справки\", q:\"Найти справку\", btn:\"Заказать справку\", sub:\"Об обучении, о стипендии, для военкомата\"},\n  app:  {title:\"Подать заявление\", q:\"Найти заявление\", btn:\"Подать заявление\", sub:\"Матпомощь, график, перезачёт, отпуск\"},\n  archive: {title:\"Архив\", q:\"Найти в архиве\", btn:\"Архив\", sub:\"Ранее выданные справки и решения\"}\n};\nfunction vRequests(){\n  const active = S.reqs.filter(r=>r.step<3), done = S.reqs.filter(r=>r.step>=3);\n  const act = (k, i) => `<button class=\"docs-act ${k===\"cert\"?\"main\":\"\"}\" data-action=\"picker\" data-k=\"${k}\">${ic(i,\"i\")}<span class=\"grow\"><b>${PICK[k].btn}<\/b><small>${PICK[k].sub}<\/small><\/span>${k===\"archive\"&&done.length?`<span class=\"chip\">${done.length}<\/span>`:\"\"}${ic(\"arrow\",\"i s\")}<\/button>`;\n  return `<div class=\"view\">\n    ${pageH(\"Документы\")}\n    <div class=\"docs-grid\">\n      <div class=\"docs-acts\">${act(\"cert\",\"doc\")}${act(\"app\",\"requests\")}${act(\"archive\",\"clock\")}<\/div>\n      <section class=\"docs-mine\"><div class=\"card-h\"><h2>Мои заявки<\/h2><span class=\"muted small\">${active.length} ${plural(active.length,\"активная\",\"активных\",\"активных\")}<\/span><\/div>\n        <div style=\"display:grid;gap:10px\">${active.map(reqCard).join(\"\") || `<div class=\"card empty\">Активных заявок нет. Закажите справку — электронная готова за минуту.<\/div>`}<\/div><\/section>\n    <\/div>\n  <\/div>`;\n}\n\n/* ===== окно выбора: кнопка «перетекает» в стеклянное окно по центру ===== */\nconst SRCH = '<svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"6.5\"/><path d=\"m16 16 4.5 4.5\"/><\/svg>';\nfunction pickItems(k){\n  if(k===\"archive\") return S.reqs.filter(r=>r.step>=3).map(r=>({id:r.id, t:r.t, d:`${r.sub} · № ${r.id}`, k:`${r.t} ${r.sub} ${r.id}`, body: reqCard(r)}));\n  return CATALOG.filter(c=>!!c.app === (k===\"app\")).map(c=>({id:c.id, t:c.t, d:`${c.d}`, sla:c.sla, k:`${c.t} ${c.d}`,\n    body:`<form class=\"form gm-form\" data-id=\"${c.id}\">${orderFields(c)}\n      <div class=\"kv small\" style=\"padding:12px;border-radius:12px;background:var(--surface-2)\"><dt>Срок<\/dt><dd>${c.sla}<\/dd><dt>Данные<\/dt><dd>${STUDENT.fio}, ${STUDENT.group}<\/dd><\/div>\n      <p class=\"err\" hidden><\/p><button class=\"btn block\" type=\"submit\">${c.app?\"Подать заявление\":\"Заказать справку\"}<\/button><\/form>`}));\n}\nfunction openPicker(k, openId){\n  const from = document.querySelector(`[data-action=\"picker\"][data-k=\"${k}\"]`), P = PICK[k], list = pickItems(k);\n  const root = document.getElementById(\"sheetRoot\");\n  root.innerHTML = `<div class=\"gm-wrap\" data-action=\"closesheet\"><div class=\"gm glass\" role=\"dialog\" aria-modal=\"true\" aria-label=\"${P.title}\" data-k=\"${k}\">\n    <div class=\"gm-in\">\n      <div class=\"gm-h\"><h2>${P.title}<\/h2><button class=\"iconbtn\" data-action=\"closesheet\" aria-label=\"Закрыть\">${ic(\"close\",\"i s\")}<\/button><\/div>\n      <label class=\"gm-q\">${SRCH}<input id=\"gmQ\" type=\"search\" placeholder=\"${P.q}\" autocomplete=\"off\" aria-label=\"${P.q}\"><\/label>\n      <div class=\"gm-list\" id=\"gmList\">${list.map(it=>`<div class=\"gm-it\" data-id=\"${it.id}\" data-k=\"${esc(it.k.toLowerCase())}\">\n          <button class=\"gm-row\" data-action=\"gmopen\" data-id=\"${it.id}\" aria-expanded=\"false\"><span class=\"chev\">${ic(\"arrow\",\"i s\")}<\/span><span class=\"grow\"><b>${esc(it.t)}<\/b><small>${esc(it.d)}<\/small><\/span>${it.sla?`<span class=\"chip ${it.sla===\"Сразу\"?\"mark\":\"\"}\">${it.sla}<\/span>`:\"\"}<\/button>\n          <div class=\"gm-body\"><div>${it.body}<\/div><\/div><\/div>`).join(\"\") || \"\"}\n        <p class=\"gm-empty muted\" ${list.length?\"hidden\":\"\"}>${k===\"archive\"?\"В архиве пока пусто.\":\"Ничего не нашлось.\"} <button class=\"link\" data-go=\"inbox\" data-tab=\"chat\">Спросить методиста<\/button><\/p><\/div>\n    <\/div><\/div><\/div>`;\n  const gm = root.querySelector(\".gm\");\n  morph(gm, from, false);\n  if(openId) gmToggle(openId, true);\n  setTimeout(()=>root.querySelector(openId ? `.gm-it[data-id=\"${openId}\"] select, .gm-it[data-id=\"${openId}\"] textarea` : \"#gmQ\")?.focus({preventScroll:true}), 60);\n}\n// FLIP: окно стартует с размеров и места кнопки и пружинит в центр; закрытие — обратно в кнопку\nfunction morph(gm, from, back){\n  const still = matchMedia(\"(prefers-reduced-motion: reduce)\").matches || document.documentElement.classList.contains(\"calm\");\n  const wrap = gm.parentElement;\n  if(!from || !from.isConnected || still){\n    const a = gm.animate([{opacity:0, transform:\"scale(.96)\"},{opacity:1, transform:\"none\"}], {duration: still ? 120 : 220, easing:\"ease-out\", direction: back?\"reverse\":\"normal\", fill:\"both\"});\n    wrap.animate([{opacity:0},{opacity:1}], {duration:200, direction: back?\"reverse\":\"normal\", fill:\"both\"});\n    return a.finished;\n  }\n  const f = from.getBoundingClientRect(), t = gm.getBoundingClientRect();\n  const dx = (f.left + f.width/2) - (t.left + t.width/2), dy = (f.top + f.height/2) - (t.top + t.height/2);\n  const start = {transform:`translate(${dx}px,${dy}px) scale(${f.width/t.width},${f.height/t.height})`, borderRadius:\"999px\"}, end = {transform:\"none\", borderRadius:\"32px\"};\n  from.style.visibility = \"hidden\";\n  const o = {duration: back ? 380 : 620, easing: back ? \"cubic-bezier(.5,0,.75,0)\" : \"cubic-bezier(.2,1.15,.35,1)\", fill:\"both\"};\n  const a = gm.animate(back ? [end, start] : [start, end], o);\n  gm.querySelector(\".gm-in\").animate(back ? [{opacity:1},{opacity:0, offset:.4},{opacity:0}] : [{opacity:0},{opacity:0, offset:.35},{opacity:1}], o);\n  wrap.animate([{backgroundColor:\"transparent\", backdropFilter:\"blur(0)\"},{}], {duration: o.duration, direction: back?\"reverse\":\"normal\", fill:\"both\"});\n  if(!back){ a.finished.then(()=>{ from.style.visibility = \"\"; }); setTimeout(()=>{ from.style.visibility = \"\"; }, o.duration + 100); }\n  return a.finished.then(()=>{ if(back) from.style.visibility = \"\"; });\n}\nfunction gmToggle(id, open){\n  document.querySelectorAll(\"#gmList .gm-it\").forEach(it=>{\n    const on = it.dataset.id===id && (open ?? !it.classList.contains(\"open\"));\n    it.classList.toggle(\"open\", on); it.querySelector(\".gm-row\").setAttribute(\"aria-expanded\", on);\n    if(on) setTimeout(()=>it.scrollIntoView({block:\"nearest\", behavior:\"smooth\"}), 260);\n  });\n}\n\nconst NOTE_ICON = {schedule:\"schedule\", deadline:\"clock\", docs:\"doc\", dean:\"flag\", news:\"news\", security:\"shield\"};\nfunction vInbox(){\n  const f = S.noteFilter;\n  const list = DEFAULT_NOTES.filter(n => f===\"all\" ? true : f===\"imp\" ? n.imp : f===\"schedule\" ? n.k===\"schedule\" : f===\"deadline\" ? n.k===\"deadline\"||n.k===\"dean\" : n.k===\"news\"||n.k===\"docs\"||n.k===\"security\");\n  const notesHtml = `<div class=\"row\" style=\"gap:8px\"><div class=\"seg grow\" role=\"group\" aria-label=\"Фильтр\">${[[\"all\",\"Все\"],[\"imp\",\"Важное\"],[\"schedule\",\"Расписание\"],[\"deadline\",\"Деканат\"],[\"other\",\"Прочее\"]].map(([k,n])=>`<button data-action=\"nf\" data-k=\"${k}\" aria-pressed=\"${f===k}\">${n}<\/button>`).join(\"\")}<\/div><\/div>\n    <section class=\"card\"><div class=\"card-h\"><h2>${list.length} ${plural(list.length,\"уведомление\",\"уведомления\",\"уведомлений\")}<\/h2>${unread()?`<button class=\"link\" data-action=\"readall\">Прочитать все<\/button>`:\"\"}<\/div>\n    <div class=\"list\">${list.map(n=>{ const r=S.read.includes(n.id); return `<button class=\"note-item k-${n.k} ${r?\"read\":\"\"}\" data-action=\"note\" data-id=\"${n.id}\"><span class=\"ic\">${ic(NOTE_ICON[n.k],\"i s\")}<\/span><span style=\"min-width:0\"><h3>${r?\"\":'<span class=\"unread-dot\"><\/span>'}${esc(n.t)}<\/h3><p>${esc(n.p)}<\/p><p class=\"small\" style=\"margin-top:4px\">${esc(n.when)}${n.imp?' · <span style=\"color:var(--alert);font-weight:600\">важно<\/span>':\"\"}<\/p><\/span><\/button>`; }).join(\"\") || '<div class=\"empty\">Здесь пока пусто.<\/div>'}<\/div><\/section>`;\n  return `<div class=\"view\">\n    ${pageH(\"Уведомления\")}\n    <div class=\"seg ms-seg\" role=\"tablist\" aria-label=\"Раздел\">\n      <button role=\"tab\" data-action=\"itab\" data-t=\"chat\" aria-pressed=\"${S.inboxTab===\"chat\"}\" aria-selected=\"${S.inboxTab===\"chat\"}\">Мессенджер${chatUnread()?`<span class=\"ms-badge\">${chatUnread()}<\/span>`:\"\"}<\/button>\n      <button role=\"tab\" data-action=\"itab\" data-t=\"notes\" aria-pressed=\"${S.inboxTab===\"notes\"}\" aria-selected=\"${S.inboxTab===\"notes\"}\">Новости${unread()?`<span class=\"ms-badge\">${unread()}<\/span>`:\"\"}<\/button>\n      <button role=\"tab\" data-action=\"itab\" data-t=\"events\" aria-pressed=\"${S.inboxTab===\"events\"}\" aria-selected=\"${S.inboxTab===\"events\"}\">Мероприятия<\/button>\n    <\/div>\n    ${S.inboxTab===\"notes\"?notesHtml:S.inboxTab===\"events\"?vEvents():vMessenger()}\n  <\/div>`;\n}\n\nconst chatMsgs = id => id===\"dean\" ? S.chat : CHATS.find(c=>c.id===id).msgs.concat(S.chats[id]||[]);\nconst chatUnreadOf = c => S.chatRead.includes(c.id) ? 0 : c.unread;\nconst chatUnread = () => CHATS.reduce((n,c)=>n+chatUnreadOf(c), 0);\nconst stamp = () => { const d = now(); return `${d.getDate()} ${MONS[d.getMonth()]}, ${String(d.getHours()).padStart(2,\"0\")}:${String(d.getMinutes()).padStart(2,\"0\")}`; };\n// в списке: сегодня — время, раньше — дата\nconst shortW = w => { const [day, time] = w.split(\", \"), d = now(); return day === `${d.getDate()} ${MONS[d.getMonth()]}` ? time : day; };\nconst ICO = {\n  info:'<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5M12 8v.01\"/>',\n  clip:'<path d=\"M20 11.5 12.4 19a5 5 0 0 1-7.1-7.1l8-8a3.4 3.4 0 0 1 4.8 4.8l-8 8a1.7 1.7 0 0 1-2.4-2.4l7.3-7.3\"/>',\n  send:'<path d=\"M4.5 12 20 4.5 15.5 20l-3-6.5z\"/><path d=\"m12.5 13.5 7.5-9\"/>',\n  back:'<path d=\"m14.5 6-6 6 6 6\"/>'\n};\nconst svg = p => `<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">${p}<\/svg>`;\n/* список слева: поиск по чатам и справочнику людей. При вводе перерисовывается только #msItems, чтобы поле не теряло фокус */\nconst nrm = v => String(v).toLowerCase().replace(/ё/g,\"е\");\nfunction chatRow(x){\n  const m = chatMsgs(x.id), last = m[m.length-1], u = chatUnreadOf(x);\n  return `<button class=\"ms-it ${x.id===S.chatId?\"on\":\"\"}\" data-action=\"chat\" data-id=\"${x.id}\" aria-current=\"${x.id===S.chatId}\">\n      <span class=\"avatar ${x.group?\"grp\":\"\"}\">${x.ini}<\/span>\n      <span class=\"ms-txt\"><span class=\"ms-top\"><b>${esc(x.n)}<\/b><time>${last?shortW(last.w):\"\"}<\/time><\/span>\n        <span class=\"ms-top\"><small>${last?(last.me?\"Вы: \":last.who?esc(last.who.split(\" \")[0])+\": \":\"\")+esc(last.t||last.file||\"\"):\"Новый чат\"}<\/small>${u?`<span class=\"ms-badge\">${u}<\/span>`:\"\"}<\/span><\/span><\/button>`;\n}\nconst personRow = p => `<button class=\"ms-it ms-person\" data-action=\"person\" data-id=\"${p.id}\">\n      <span class=\"avatar ${p.k}\">${p.ini}<\/span>\n      <span class=\"ms-txt\"><span class=\"ms-top\"><b>${esc(p.n)}<\/b><\/span><span class=\"ms-top\"><small>${esc(p.role)}<\/small><\/span><\/span>\n      <span class=\"ms-go\">${CHATS.some(c=>c.id===p.id)?\"Открыть\":\"Написать\"}<\/span><\/button>`;\n// раскладка: «rbv» → «ким»; слово от 4 букв ищется по основе («сеть» находит «сети», «петрову» — «Петров»)\nconst EN_KB = \"qwertyuiop[]asdfghjkl;'zxcvbnm,.`\", RU_KB = \"йцукенгшщзхъфывапролджэячсмитьбюё\";\nconst toRu = v => [...v].map(c => { const i = EN_KB.indexOf(c); return i < 0 ? c : RU_KB[i]; }).join(\"\");\nconst stem = w => w.length >= 4 ? w.slice(0, w.length - (w.length > 5 ? 2 : 1)) : w;\nfunction matcher(raw){\n  const q = nrm(raw).trim();\n  if(!q) return () => true;\n  const variants = [q, toRu(q)].filter((v,i,a) => a.indexOf(v) === i).map(v => v.split(/\\s+/).map(stem));\n  return x => { const hay = nrm([x.n, x.role, ...(x.info||[]).map(r=>r[1])].join(\" \")); return variants.some(ws => ws.every(w => hay.includes(w))); };\n}\nfunction msItems(){\n  const q = nrm(S.msQ).trim(), hit = matcher(S.msQ);\n  if(S.msKind !== \"chats\"){\n    const ppl = PEOPLE.filter(p => p.k===S.msKind && hit(p));\n    return ppl.map(personRow).join(\"\") || '<p class=\"ms-empty\">Никого не нашли. Попробуйте фамилию или группу.<\/p>';\n  }\n  const chats = CHATS.filter(hit), ppl = q ? PEOPLE.filter(p => !CHATS.some(c=>c.id===p.id) && hit(p)) : [];\n  return chats.map(chatRow).join(\"\") + (ppl.length ? `<p class=\"ms-sec\">Люди в вузе<\/p>${ppl.map(personRow).join(\"\")}` : \"\")\n    || '<p class=\"ms-empty\">Ничего не нашли. Поищите среди преподавателей и студентов.<\/p>';\n}\nfunction vMessenger(){\n  const c = CHATS.find(x=>x.id===S.chatId), msgs = chatMsgs(c.id);\n  const list = `<label class=\"ms-search\">${SRCH}<input id=\"msQ\" type=\"search\" value=\"${esc(S.msQ)}\" placeholder=\"Поиск людей и чатов\" autocomplete=\"off\" aria-label=\"Поиск преподавателей, студентов и чатов\"><\/label>\n      <div class=\"ms-kinds\" role=\"tablist\" aria-label=\"Кого искать\">${[[\"chats\",\"Чаты\"],[\"teacher\",\"Преподаватели\"],[\"student\",\"Студенты\"]].map(([k,n])=>`<button role=\"tab\" data-action=\"mskind\" data-k=\"${k}\" aria-selected=\"${S.msKind===k}\">${n}<\/button>`).join(\"\")}<\/div>\n      <div class=\"ms-items\" id=\"msItems\">${msItems()}<\/div>`;\n  let prevDay = \"\";\n  const bubbles = msgs.map(m=>{ const day = m.w.split(\", \")[0], sep = day!==prevDay ? `<div class=\"ms-day\"><span>${day===shortW(m.w)?day:\"Сегодня\"}<\/span><\/div>` : \"\"; prevDay = day;\n    return sep + `<div class=\"msg ${m.me?\"me\":\"them\"}\">${!m.me&&c.group&&m.who?`<b class=\"ms-who\">${esc(m.who)}<\/b>`:\"\"}${m.file?`<span class=\"ms-file\">${svg(ICO.clip)}${esc(m.file)}<\/span>`:\"\"}${m.t?esc(m.t):\"\"}<small>${esc(m.w.split(\", \")[1]||m.w)}<\/small><\/div>`; }).join(\"\");\n  return `<div class=\"ms\" data-open=\"${S.chatOpen?1:0}\">\n    <nav class=\"ms-list\" aria-label=\"Чаты и поиск людей\">${list}<\/nav>\n    <section class=\"ms-chat\" aria-label=\"Чат: ${esc(c.n)}\">\n      <header class=\"ms-h\">\n        <button class=\"ms-ib ms-back\" data-action=\"chatback\" aria-label=\"К списку чатов\">${svg(ICO.back)}<\/button>\n        <span class=\"avatar ${c.group?\"grp\":\"\"}\">${c.ini}<\/span>\n        <span class=\"ms-name\"><b>${esc(c.n)}<\/b><small>${esc(c.role)}<\/small><\/span>\n        <button class=\"ms-ib\" data-action=\"chatinfo\" aria-label=\"О контакте\">${svg(ICO.info)}<\/button>\n      <\/header>\n      ${c.id===\"dean\"?`<div class=\"topics ms-topics\">${[\"Справка\",\"Пересдача\",\"Стипендия\",\"Общежитие\",\"Перевод\"].map(t=>`<button data-action=\"topic\" data-t=\"${t}\">${t}<\/button>`).join(\"\")}<\/div>`:\"\"}\n      <div class=\"chat ms-msgs\" id=\"chat\" aria-live=\"polite\">${bubbles || `<p class=\"ms-hello\"><span class=\"avatar\">${c.ini}<\/span>Это начало переписки с ${esc(c.n)}.<br>Напишите первое сообщение.<\/p>`}${S.typing===c.id?`<div class=\"msg them typing\" aria-label=\"Печатает\"><i><\/i><i><\/i><i><\/i><\/div>`:\"\"}<\/div>\n      <form class=\"ms-comp\" id=\"composer\">\n        <label class=\"ms-ib ms-att\" title=\"Прикрепить файл\"><input type=\"file\" id=\"chatFile\" class=\"sr\" aria-label=\"Прикрепить файл\">${svg(ICO.clip)}<\/label>\n        <input id=\"chatInput\" placeholder=\"${c.id===\"dean\"?\"Напишите вопрос деканату\":\"Сообщение\"}\" autocomplete=\"off\" aria-label=\"Сообщение\">\n        <button class=\"ms-ib ms-send\" type=\"submit\" aria-label=\"Отправить\">${svg(ICO.send)}<\/button>\n      <\/form>\n    <\/section>\n  <\/div>`;\n}\nfunction sendChat(msg){\n  const id = S.chatId, c = CHATS.find(x=>x.id===id);\n  if(id===\"dean\") S.chat.push(msg); else (S.chats[id] = S.chats[id] || []).push(msg);\n  save(); render();\n  if(!c.reply || S.typing) return;\n  setTimeout(()=>{ S.typing = id; if(S.view===\"inbox\") render(); }, 600);\n  setTimeout(()=>{ S.typing = null; const r = {me:false, t:c.reply, w:stamp(), who:c.role.split(\" · \")[0]};\n    if(id===\"dean\") S.chat.push(r); else (S.chats[id] = S.chats[id] || []).push(r);\n    save(); if(S.view===\"inbox\") render(); if(S.view!==\"inbox\" || S.chatId!==id) toast(`${c.n}: новое сообщение`); }, 2400);\n}\n\n/* ===== доска мероприятий ===== */\nfunction evCard(ev, hero){\n  const go = evGoing(ev), n = ev.base + (go?1:0), dd = daysTo(ev.d);\n  return `<article class=\"evb ${hero?\"hero\":\"\"} ${go?\"going\":\"\"}\">\n    <div class=\"evb-date\" aria-hidden=\"true\"><b>${ev.d.getDate()}<\/b><span>${MONS[ev.d.getMonth()]}<\/span><small>${DOW[ev.d.getDay()]}<\/small><\/div>\n    <div class=\"evb-body\">\n      <div class=\"evb-tags\"><span class=\"chip accent\">${ev.cat}<\/span>${ev.joint?`<span class=\"chip joint\">совместно · ${esc(ev.joint)}<\/span>`:\"\"}${dd<=3?`<span class=\"chip warn\">${relDays(dd)}<\/span>`:\"\"}<\/div>\n      <h3>${esc(ev.t)}<\/h3>\n      <p class=\"evb-meta\">${fmtDate(ev.d)}, ${DOWF[ev.d.getDay()]} · ${ev.s}–${ev.e}<br>${esc(ev.place)} · ${esc(ev.org)}<\/p>\n      ${hero?`<p class=\"evb-desc\">${esc(ev.desc)}<\/p>`:\"\"}\n      <div class=\"evb-act\"><button class=\"btn sm ${go?\"\":\"ghost\"}\" data-action=\"evgo\" data-id=\"${ev.id}\" aria-pressed=\"${go}\">${go?ic(\"check\",\"i s\")+\"Иду\":\"Пойду\"}<\/button>\n        <button class=\"btn sm ghost\" data-action=\"evmore\" data-id=\"${ev.id}\">Подробнее<\/button><span class=\"evb-n\">${n} ${plural(n,\"идёт\",\"идут\",\"идут\")}<\/span><\/div>\n    <\/div><\/article>`;\n}\nfunction vEvents(){\n  const f = S.evFilter, list = EVENTS.filter(ev => f===\"all\" || (f===\"joint\" ? ev.joint : f===\"mine\" ? evGoing(ev) : ev.cat===f));\n  const mine = EVENTS.filter(evGoing).length;\n  return `<div class=\"evb-filter\" role=\"group\" aria-label=\"Фильтр мероприятий\">${EV_CATS.map(([k,n])=>`<button data-action=\"evf\" data-k=\"${k}\" aria-pressed=\"${f===k}\">${n}${k===\"mine\"&&mine?` <span class=\"ms-badge\">${mine}<\/span>`:\"\"}<\/button>`).join(\"\")}<\/div>\n    <p class=\"muted small evb-note\">События вуза и совместные с другими организациями. «Пойду» добавляет мероприятие в ваше расписание.<\/p>\n    <div class=\"evb-grid\">${list.map((ev,i)=>evCard(ev, i===0 && f===\"all\")).join(\"\") || `<div class=\"empty\">${f===\"mine\"?\"Вы пока никуда не записались.\":\"В этой категории пока ничего нет.\"}<\/div>`}<\/div>`;\n}\nfunction evToggle(id){\n  const ev = EVENTS.find(x=>x.id===id);\n  if(evGoing(ev)){ window.lkMy.del(\"ev-\"+id); toast(\"Убрано из расписания\"); }\n  else { window.lkMy.add(evKey(ev.d), {id:\"ev-\"+id, s:toMin(ev.s), e:toMin(ev.e), t:ev.t, ty:\"Мероприятие\", room:ev.place, who:ev.org}); toast(\"Добавлено в расписание: \" + fmtDate(ev.d)); }\n}\nfunction evMore(id){\n  const ev = EVENTS.find(x=>x.id===id), go = evGoing(ev);\n  openSheet(ev.t, `<p style=\"margin:0 0 14px\">${esc(ev.desc)}<\/p>\n    <dl class=\"kv\"><dt>Когда<\/dt><dd>${fmtDate(ev.d)}, ${DOWF[ev.d.getDay()]}, ${ev.s}–${ev.e}<\/dd><dt>Где<\/dt><dd>${esc(ev.place)}<\/dd><dt>Организатор<\/dt><dd>${esc(ev.org)}<\/dd>\n      ${ev.joint?`<dt>Совместно с<\/dt><dd>${esc(ev.joint)}<\/dd>`:\"\"}<dt>Участники<\/dt><dd>${ev.base+(go?1:0)}<\/dd><\/dl>\n    <button class=\"btn block\" data-action=\"evgo\" data-id=\"${ev.id}\" data-sheet=\"1\" style=\"margin-top:18px\">${go?\"Не пойду\":\"Пойду — добавить в расписание\"}<\/button>`);\n}\n\nfunction infoRow([label, val, secret], key){\n  const open = !secret || S.shown[key];\n  const shownVal = open ? esc(val) : \"•\".repeat(Math.min(10, val.length));\n  return `<div class=\"pf-row\"><dt>${label}<\/dt><dd><span class=\"pf-v ${open?\"\":\"masked\"}\">${shownVal}<\/span>${secret ? `<span class=\"pf-tools\">\n      ${open && /Пароль|Логин|почта/.test(label) ? `<button class=\"iconbtn sm\" data-action=\"pfcopy\" data-k=\"${key}\" aria-label=\"Скопировать: ${label}\">${ic(\"copy\",\"i s\")}<\/button>` : \"\"}\n      <button class=\"iconbtn sm\" data-action=\"pfeye\" data-k=\"${key}\" aria-pressed=\"${open}\" aria-label=\"${open?\"Скрыть\":\"Показать\"}: ${label}\">${ic(open?\"eyeoff\":\"eye\",\"i s\")}<\/button><\/span>` : \"\"}<\/dd><\/div>`;\n}\nfunction vProfile(){\n  if(S.view===\"requests\") return vRequests();\n  const cnt = k => S.reqs.filter(r=>r.step<3 && kindOf(r)===k).length;\n  const docBtn = (k, t, sub) => { const n = k===\"all\" ? S.reqs.filter(r=>r.step<3).length : cnt(k);\n    return `<button class=\"pf-doc\" data-action=\"docs\" ${k===\"all\"?\"\":`data-k=\"${k}\"`}>${ic(k===\"app\"?\"requests\":k===\"all\"?\"grades\":\"doc\",\"i\")}<span class=\"grow\"><b>${t}<\/b><small>${sub}<\/small><\/span>${n?`<span class=\"chip mark\">${n}<\/span>`:\"\"}${ic(\"arrow\",\"i s\")}<\/button>`; };\n  return `<div class=\"view\">\n    ${pageH(\"Профиль\")}\n    <div class=\"pf-top\">\n      <section class=\"idcard\" aria-label=\"Студенческий билет\">\n        <div class=\"who\"><span class=\"ph\">${STUDENT.initials}<\/span><div style=\"min-width:0\"><span class=\"eyebrow\" style=\"color:inherit;opacity:.7\">Студенческий билет № ${STUDENT.id}<\/span><h2>${STUDENT.fio}<\/h2><\/div><\/div>\n        <div class=\"grid\"><div><small>Институт<\/small>ИИТ<\/div><div><small>Группа<\/small>${STUDENT.group}<\/div><div><small>Курс<\/small>${STUDENT.course}<\/div><div><small>Действует до<\/small>31.08.2027<\/div><\/div>\n        <button class=\"btn\" data-action=\"card\" style=\"background:var(--mark);color:var(--mark-ink)\">${ic(\"card\",\"i s\")}Показать QR для входа<\/button>\n      <\/section>\n      <div class=\"pf-docs\">\n        ${docBtn(\"cert\", \"Справки\", \"Заказать, скачать готовые\")}\n        ${docBtn(\"app\", \"Заявления\", \"Подать и отследить\")}\n        ${docBtn(\"all\", \"Документы\", \"Мои заявки и архив\")}\n      <\/div>\n    <\/div>\n    <section class=\"card pf-info\" aria-label=\"Данные студента\">\n      <div class=\"seg pf-tabs\" role=\"tablist\" aria-label=\"Окна профиля\">${PROFILE_INFO.map((p,i)=>`<button role=\"tab\" data-action=\"pftab\" data-i=\"${i}\" aria-pressed=\"${S.infoTab===i}\" aria-selected=\"${S.infoTab===i}\">${p.t}<\/button>`).join(\"\")}<\/div>\n      <div class=\"pf-track\" id=\"pfTrack\">${PROFILE_INFO.map(p=>`<div class=\"pf-pane\" role=\"tabpanel\" aria-label=\"${p.t}\"><h2>${p.t===\"Основное\"?\"Основная информация\":p.t===\"Личное\"?\"Персональная информация\":\"Контакты\"}<\/h2>\n        <dl class=\"pf-list\">${p.rows.map((r,j)=>infoRow(r, p.id+j)).join(\"\")}<\/dl><\/div>`).join(\"\")}<\/div>\n      <p class=\"muted small\" style=\"margin-top:12px\">Нашли ошибку в данных? <button class=\"link\" data-go=\"inbox\" data-tab=\"chat\">Напишите методисту<\/button><\/p>\n    <\/section>\n  <\/div>`;\n}\n\nconst tg = (id, on, label, sub, act=\"pref\") => `<div class=\"row\"><span class=\"grow\"><b style=\"font-weight:500\">${label}<\/b>${sub?`<br><span class=\"muted small\">${sub}<\/span>`:\"\"}<\/span><label class=\"toggle\"><input type=\"checkbox\" id=\"${id}\" data-action=\"${act}\" data-k=\"${id}\" ${on?\"checked\":\"\"} aria-label=\"${label}\"><span><\/span><\/label><\/div>`;\nconst SVG = p => `<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">${p}<\/svg>`;\nconst THEMES = [[\"light\",\"Светлая\",'<circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8\"/>'],\n  [\"auto\",\"Авто\",\"\"], [\"dark\",\"Тёмная\",'<path d=\"M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z\"/>']];\nconst CLOCKS = [[\"classic\",\"Классика\",'<div class=\"pv\">09:41<\/div>'], [\"thin\",\"Тонкие\",'<div class=\"pv thin\">09:41<\/div>'], [\"stack\",\"Стопка\",'<div class=\"pv stack\">09<i>41<\/i><\/div>']];\n/* выбор фона: готовые варианты и своё фото (файл не уходит с устройства) */\nfunction bgPick(U){\n  const ph = window.lkUI.photo(), cur = document.documentElement.dataset.bg;\n  const tiles = window.lkUI.bgs.map(([v,n,t,ob,ow]) => {\n    if(v===\"photo\") return ph\n      ? `<button role=\"radio\" data-action=\"bgpick\" data-v=\"photo\" aria-checked=\"${cur===\"photo\"}\"><span class=\"sw photo\" style=\"background-image:url(${ph.src})\"><\/span>${n}<\/button>`\n      : `<label class=\"bg-up\" role=\"radio\" aria-checked=\"false\" tabindex=\"0\"><input type=\"file\" id=\"bgFile\" accept=\"image/*\" class=\"sr\" aria-label=\"Загрузить своё фото для фона\"><span class=\"sw add\">${SVG('<path d=\"M12 5v14M5 12h14\"/>')}<\/span>${n}<\/label>`;\n    return `<button role=\"radio\" data-action=\"bgpick\" data-v=\"${v}\" aria-checked=\"${cur===v}\"><span class=\"sw\" data-v=\"${v}\" ${t?`style=\"--bgt:${t};--ob:${ob};--ow:${ow}\"`:\"\"}><\/span>${n}<\/button>`;\n  }).join(\"\");\n  return `<div class=\"bg-pick\" role=\"radiogroup\" aria-label=\"Фон\">${tiles}<\/div>\n    ${ph?`<label class=\"link bg-change\"><input type=\"file\" id=\"bgFile\" accept=\"image/*\" class=\"sr\" aria-label=\"Выбрать другое фото\">Другое фото<\/label>`:\"\"}`;\n}\nfunction vSettings(){\n  const U = window.lkUI.get(), ti = THEMES.findIndex(t=>t[0]===U.theme);\n  return `<div class=\"view\">\n    ${pageH(\"Настройки\")}\n    <div class=\"cols\">\n      <div class=\"stack\">\n        <section class=\"card\"><div class=\"card-h\"><h2>Безопасность<\/h2>${ic(\"shield\",\"i s\")}<\/div>\n          <div class=\"list\">\n            ${tg(\"tfa\", S.tfa, \"Вход с кодом подтверждения\", \"Код из приложения при входе с нового устройства\")}\n            <div><div class=\"row\" style=\"margin-bottom:8px\"><b class=\"grow\" style=\"font-weight:500\">Где выполнен вход<\/b><span class=\"muted small\">${S.devices.length}<\/span><\/div>\n              <div style=\"display:grid;gap:8px\">${S.devices.map(d=>`<div class=\"row small\"><span class=\"grow\">${esc(d.n)}<br><span class=\"muted\">${d.cur?\"это устройство\":esc(d.w)}<\/span><\/span>${d.cur?'<span class=\"chip ok\">Активно<\/span>':`<button class=\"btn sm ghost\" data-action=\"kill\" data-id=\"${d.id}\">Завершить<\/button>`}<\/div>`).join(\"\")}<\/div><\/div>\n            <div><b style=\"font-weight:500\">Кто смотрел мои данные<\/b><p class=\"muted small\" style=\"margin:2px 0 8px\">Каждый просмотр сотрудником записывается с причиной.<\/p>\n              <div style=\"display:grid;gap:8px\">${ACCESS_LOG.map(([w,what,why,d])=>`<div class=\"small\"><div class=\"row\"><b class=\"grow\" style=\"font-weight:600\">${esc(w)}<\/b><span class=\"muted mono\">${d}<\/span><\/div><span class=\"muted\">${esc(what)} — ${esc(why)}<\/span><\/div>`).join(\"\")}<\/div><\/div>\n          <\/div>\n        <\/section>\n        <section class=\"card\"><div class=\"card-h\"><h2>Уведомления и приватность<\/h2><\/div>\n          <div class=\"list\">\n            ${tg(\"sched\", S.prefs.sched, \"Изменения расписания\", \"Сразу, push\")}\n            ${tg(\"dead\", S.prefs.dead, \"Сроки и дедлайны\", \"За 5 дней и за день\")}\n            ${tg(\"news\", S.prefs.news, \"Новости вуза\", \"Раз в неделю, подборкой\")}\n            ${tg(\"phone\", S.prefs.phone, \"Показывать мой телефон группе\", \"Видят только одногруппники и куратор\")}\n          <\/div>\n        <\/section>\n      <\/div>\n      <div class=\"stack set-look\">\n        <section class=\"card look\" aria-label=\"Внешний вид\"><div class=\"card-h\"><h2>Внешний вид<\/h2><\/div>\n          <div class=\"ap-row\"><b>Тема<\/b>\n            <div class=\"theme-sw\" role=\"radiogroup\" aria-label=\"Тема\" style=\"--i:${ti}\"><span class=\"knob\"><\/span>\n              ${THEMES.map(([v,n,p])=>`<button role=\"radio\" data-action=\"theme\" data-v=\"${v}\" aria-checked=\"${U.theme===v}\" aria-label=\"${n}\" title=\"${n}\">${p?SVG(p):\"Авто\"}<\/button>`).join(\"\")}<\/div><\/div>\n          <div class=\"ap-row\"><b>Эффект Liquid Glass <small id=\"glassVal\">${U.glass}%<\/small><\/b>\n            <div class=\"glass-rng\"><input type=\"range\" id=\"glassRng\" min=\"0\" max=\"100\" step=\"5\" value=\"${U.glass}\" style=\"--v:${U.glass}%\" aria-label=\"Сила эффекта жидкого стекла\">\n              <div class=\"ends\"><span>Матовое<\/span><span>Прозрачное<\/span><\/div><\/div><\/div>\n          <div class=\"ap-row\"><b>Стиль часов<\/b>\n            <div class=\"clock-pick\" role=\"radiogroup\" aria-label=\"Стиль часов\">${CLOCKS.map(([v,n,pv])=>`<button role=\"radio\" data-action=\"clockst\" data-v=\"${v}\" aria-checked=\"${U.clock===v}\">${pv}${n}<\/button>`).join(\"\")}<\/div><\/div>\n          <div class=\"ap-row\"><b>Фон<\/b>${bgPick(U)}<\/div>\n          <div class=\"ap-row ap-tint\">${tg(\"tint\", U.tint, \"Оттенок стекла под фон\", \"Стекло, карточки и док подхватывают цвет фона\", \"uipref\")}<\/div>\n          <div class=\"ap-row\"><button class=\"ap-link\" data-action=\"access\"><span class=\"grow\">Универсальный доступ<small>Иконки и порядок дока, крупный текст, меньше движения<\/small><\/span><span class=\"go\">${SVG('<path d=\"m6 7 5 5-5 5M13 7l5 5-5 5\"/>')}<\/span><\/button><\/div>\n        <\/section>\n      <\/div>\n    <\/div>\n    <button class=\"btn ghost block\" data-action=\"logout\" style=\"margin-top:16px;max-width:420px\">${ic(\"key\",\"i s\")}Выйти из кабинета<\/button>\n  <\/div>`;\n}\n\nfunction vAccess(){\n  const U = window.lkUI.get(), IC = window.lkUI.icons, L = Object.fromEntries(window.lkUI.dockAll.map(d=>[d.id,d.label])), cfg = U.dock;\n  const up = SVG('<path d=\"m6 15 6-6 6 6\"/>'), dn = SVG('<path d=\"m6 9 6 6 6-6\"/>');\n  return `<div class=\"view\">\n    ${pageH(\"Универсальный доступ\")}\n    <div class=\"cols\">\n      <section class=\"card\"><div class=\"card-h\"><h2>Док<\/h2><button class=\"link\" data-action=\"dkreset\">Как было<\/button><\/div>\n        <div class=\"dk-preview glass\" aria-label=\"Так выглядит док\">${cfg.filter(c=>c.on).map(c=>`<span title=\"${L[c.id]}\">${SVG(IC[c.id][c.ic])}<\/span>`).join(\"\")}<\/div>\n        <p class=\"muted small\" style=\"margin:6px 0 4px\">Стрелки меняют порядок, переключатель убирает пункт из дока, а иконку можно выбрать из трёх.<\/p>\n        <div class=\"dk-list\">${cfg.map((c,i)=>`<div class=\"dk-row ${c.on?\"\":\"off\"}\" data-id=\"${c.id}\">\n          <span class=\"dk-move\"><button data-action=\"dkmove\" data-id=\"${c.id}\" data-d=\"-1\" ${i===0?\"disabled\":\"\"} aria-label=\"${L[c.id]}: выше\">${up}<\/button><button data-action=\"dkmove\" data-id=\"${c.id}\" data-d=\"1\" ${i===cfg.length-1?\"disabled\":\"\"} aria-label=\"${L[c.id]}: ниже\">${dn}<\/button><\/span>\n          <span class=\"dk-name\">${L[c.id]}${c.id===\"home\"?\"<small>всегда в доке<\/small>\":\"\"}<\/span>\n          <span class=\"dk-icons\" role=\"radiogroup\" aria-label=\"Иконка: ${L[c.id]}\">${IC[c.id].map((p,n)=>`<button role=\"radio\" data-action=\"dkicon\" data-id=\"${c.id}\" data-n=\"${n}\" aria-checked=\"${c.ic===n}\" aria-label=\"Вариант ${n+1}\">${SVG(p)}<\/button>`).join(\"\")}<\/span>\n          ${c.id===\"home\" ? `<span style=\"width:44px\"><\/span>` : `<label class=\"toggle\"><input type=\"checkbox\" data-action=\"dkon\" data-k=\"${c.id}\" ${c.on?\"checked\":\"\"} aria-label=\"Показывать «${L[c.id]}» в доке\"><span><\/span><\/label>`}\n        <\/div>`).join(\"\")}<\/div>\n      <\/section>\n      <section class=\"card\"><div class=\"card-h\"><h2>Чтение и движение<\/h2><\/div>\n        <div class=\"list\">\n          ${tg(\"big\", U.big, \"Крупный текст\", \"Разделы и карточки крупнее на 12 %\", \"uipref\")}\n          ${tg(\"calm\", U.calm, \"Меньше движения\", \"Без волны в доке, плавающих шаров и пружин\", \"uipref\")}\n        <\/div>\n      <\/section>\n    <\/div>\n  <\/div>`;\n}\n\n/* ===== связка с app.js ===== */\nconst go = v => window.lkGo(v);\nconst VIEWS_ZK = { grades: vGrades, requests: vProfile, inbox: vInbox, profile: vProfile, settings: vSettings, access: vAccess };\nfunction render(){\n  const m = document.getElementById(\"zk-main\");\n  m.innerHTML = VIEWS_ZK[S.view]();\n  pfMount();\n  const chat = document.getElementById(\"chat\"); if(chat) chat.scrollTop = chat.scrollHeight;\n}\n/* окна профиля листаются горизонтально (scroll-snap); переключатель и лента синхронны */\nfunction pfMount(){\n  const tr = document.getElementById(\"pfTrack\"); if(!tr) return;\n  tr.scrollLeft = S.infoTab * tr.clientWidth;\n  let t; tr.addEventListener(\"scroll\", () => { clearTimeout(t); t = setTimeout(() => {\n    if(getComputedStyle(tr).overflowX === \"visible\") return;          // на широком экране окна стоят рядом\n    const i = Math.round(tr.scrollLeft / tr.clientWidth); if(i === S.infoTab) return;\n    S.infoTab = i; document.querySelectorAll(\".pf-tabs button\").forEach((b,k)=>{ b.setAttribute(\"aria-pressed\", k===i); b.setAttribute(\"aria-selected\", k===i); });\n  }, 90); }, {passive:true});\n}\n/* ===== данные для поиска на главной: {g группа, t, s подпись, k ключевые слова, ic иконка, run} ===== */\nfunction searchItems(){\n  const out = [], CTRL = {lec:\"лекция\", prac:\"практика\", lab:\"лабораторная\", pe:\"занятие\"};\n  CURRENT.forEach((c,i) => out.push({g:\"Предметы\", t:c.s, s:`${c.ctrl} · ${sumOf(c)} баллов`, k:\"успеваемость оценки баллы\", ic:\"grades\",\n    run(){ S.gradeTab = \"now\"; S.openSubj[i] = true; go(\"grades\"); }}));\n  const who = {};\n  Object.values(SCHEDULE).flat().forEach(l => { (who[l.who] = who[l.who] || new Set()).add(l.s);\n    if(!CURRENT.some(c=>c.s===l.s)) out.push({g:\"Предметы\", t:l.s, s:`${TYPE[l.t][0]} · ${l.who}`, k:CTRL[l.t]+\" расписание\", ic:\"schedule\", run(){ go(\"schedule\"); }}); });\n  Object.entries(who).forEach(([n,set]) => out.push({g:\"Преподаватели\", t:n, s:[...set].join(\", \"), k:\"преподаватель\", ic:\"user\", run(){ go(\"schedule\"); }}));\n  CATALOG.forEach(c => out.push({g:\"Справки и заявления\", t:c.t, s:`${c.d} Срок: ${c.sla.toLowerCase()}.`, k:c.app?\"заявление\":\"справка заказать\", ic:\"doc\",\n    run(){ showOrder(c.id); }}));\n  S.reqs.forEach(r => out.push({g:\"Мои заявки\", t:r.t, s:`${r.id} · ${STEPS[r.step]}`, k:\"заявка статус \"+r.id, ic:\"requests\", run(){ go(\"requests\"); }}));\n  Object.entries(RECORD).forEach(([sem,list]) => list.forEach(([n,ctrl,g]) => out.push({g:\"Оценки\", t:n, s:`${sem} семестр · ${ctrl} · ${g} из 100, ${markOf(g,ctrl)[0]}`, k:\"зачётка оценка\",\n    ic:\"grades\", run(){ S.gradeTab = \"record\"; S.sem = +sem; go(\"grades\"); }})));\n  DEADLINES.forEach(d => out.push({g:\"Дедлайны\", t:d.t, s:`${fmtDate(new Date(d.d))} · ${d.s}`, k:\"дедлайн срок\", ic:\"clock\", run(){ go(\"grades\"); }}));\n  DEFAULT_NOTES.forEach(n => out.push({g:\"Уведомления\", t:n.t, s:n.p, k:\"уведомление\", ic:NOTE_ICON[n.k],\n    run(){ if(!S.read.includes(n.id)){ S.read.push(n.id); save(); } go(n.go || \"inbox\"); }}));\n  PEOPLE.forEach(p => out.push({g: p.k===\"teacher\" ? \"Преподаватели\" : \"Студенты\", t:p.n, s:p.role + \" · написать\", k:\"написать сообщение чат мессенджер \" + p.info.map(r=>r[1]).join(\" \"), ic:\"user\",\n    run(){ if(!CHATS.some(c=>c.id===p.id)){ CHATS.unshift(personChat(p)); S.people.push(p.id); } S.inboxTab = \"chat\"; S.chatId = p.id; S.chatOpen = true; save(); go(\"inbox\"); }}));\n  EVENTS.forEach(ev => out.push({g:\"Мероприятия\", t:ev.t, s:`${fmtDate(ev.d)}, ${ev.s} · ${ev.place}`, k:\"мероприятие событие афиша \" + ev.cat + \" \" + (ev.joint||\"\"), ic:\"news\",\n    run(){ S.inboxTab = \"events\"; go(\"inbox\"); evMore(ev.id); }}));\n  out.push({g:\"Профиль\", t:\"Студенческий билет\", s:`${STUDENT.group} · № ${STUDENT.id}`, k:\"билет qr пропуск\", ic:\"card\", run(){ go(\"profile\"); showCard(); }},\n    {g:\"Профиль\", t:\"Чат с деканатом\", s:\"Ирина Волкова, методист\", k:\"методист деканат написать вопрос\", ic:\"chat\", run(){ S.inboxTab = \"chat\"; S.chatId = \"dean\"; S.chatOpen = true; go(\"inbox\"); }},\n    {g:\"Настройки\", t:\"Безопасность и устройства\", s:\"Сеансы, код подтверждения\", k:\"пароль устройства выход\", ic:\"shield\", run(){ go(\"settings\"); }});\n  return out;\n}\nwindow.ZK = { show(v){ S.view = v; render(); }, picker: k => openPicker(k), order: showOrder, inbox(arg){ if(arg===\"news\"){ S.inboxTab = \"notes\"; } else if(arg===\"events\"){ S.inboxTab = \"events\"; } else if(CHATS.some(c=>c.id===arg)){ S.inboxTab = \"chat\"; S.chatId = arg; S.chatOpen = true; if(!S.chatRead.includes(arg)) S.chatRead.push(arg); } render(); }, unread, student: STUDENT, searchItems, icon: n => ic(n), sheet: openSheet, closeSheet: () => closeSheet(), toast };\n/* ===== тост ===== */\nlet toastT;\nfunction toast(t){\n  const r = document.getElementById(\"toastRoot\");\n  r.innerHTML = `<div class=\"toast\" role=\"status\">${esc(t)}<\/div>`;\n  clearTimeout(toastT); toastT = setTimeout(()=>{ r.innerHTML=\"\"; }, 2600);\n}\n\n/* ===== листы ===== */\nfunction openSheet(title, html, onMount){\n  const root = document.getElementById(\"sheetRoot\");\n  root.innerHTML = `<div class=\"sheet-wrap\" data-action=\"closesheet\"><div class=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-label=\"${esc(title)}\"><div class=\"grab\"><\/div>\n    <div class=\"sh\"><h2>${esc(title)}<\/h2><button class=\"iconbtn\" data-action=\"closesheet\" aria-label=\"Закрыть\">${ic(\"close\",\"i s\")}<\/button><\/div>${html}<\/div><\/div>`;\n  const first = root.querySelector(\"input,select,textarea,button.btn\");\n  if(first) setTimeout(()=>first.focus({preventScroll:true}), 50);\n  if(onMount) onMount(root);\n}\nfunction closeSheet(instant){\n  const root = document.getElementById(\"sheetRoot\"), gm = root.querySelector(\".gm\");\n  if(!gm || instant || gm.dataset.closing){ root.innerHTML = \"\"; return; }\n  gm.dataset.closing = 1;\n  const from = document.querySelector(`[data-action=\"picker\"][data-k=\"${gm.dataset.k}\"]`);\n  // запасной таймер: анимации стоят, пока вкладка не отрисовывается (фон, headless)\n  const done = () => { if(root.contains(gm)) root.innerHTML = \"\"; if(from) from.style.visibility = \"\"; };\n  morph(gm, from, true).then(done); setTimeout(done, 520);\n}\n\n/* псевдо-QR: узор для демонстрации, не настоящий код */\nfunction drawQR(canvas, seed){\n  const n = 25, px = canvas.width / n, ctx = canvas.getContext(\"2d\");\n  ctx.fillStyle = \"#fff\"; ctx.fillRect(0,0,canvas.width,canvas.height);\n  let s = 0; for(const ch of seed) s = (s*31 + ch.charCodeAt(0)) >>> 0;\n  const rnd = () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };\n  ctx.fillStyle = \"#111\";\n  const finder = (x,y) => { ctx.fillRect(x*px,y*px,7*px,7*px); ctx.fillStyle=\"#fff\"; ctx.fillRect((x+1)*px,(y+1)*px,5*px,5*px); ctx.fillStyle=\"#111\"; ctx.fillRect((x+2)*px,(y+2)*px,3*px,3*px); };\n  for(let y=0;y<n;y++) for(let x=0;x<n;x++){\n    const inF = (x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);\n    if(!inF && rnd() > .52) ctx.fillRect(x*px,y*px,px,px);\n  }\n  finder(0,0); finder(n-7,0); finder(0,n-7);\n}\n\nfunction showCard(){\n  openSheet(\"Студенческий билет\", `<div style=\"display:grid;gap:16px;justify-items:center;text-align:center\">\n    <div class=\"idcard\" style=\"width:100%;text-align:left\"><div class=\"who\"><span class=\"ph\">${STUDENT.initials}<\/span><div><span class=\"eyebrow\" style=\"color:inherit;opacity:.7\">№ ${STUDENT.id} · до 31.08.2027<\/span><h2>${STUDENT.fio}<\/h2><\/div><\/div><\/div>\n    <canvas class=\"qr\" id=\"qr\" width=\"225\" height=\"225\" style=\"width:200px;height:200px;border:10px solid #fff\"><\/canvas>\n    <p class=\"muted small\">Поднесите к турникету или покажите охране. Код обновляется каждые 30 секунд — снимок экрана не подойдёт.<\/p>\n    <span class=\"chip accent\" id=\"qrTimer\">${ic(\"clock\",\"i s\")}обновится через 30 с<\/span>\n  <\/div>`, root => {\n    const c = root.querySelector(\"#qr\"); let k = 0, t = 30; drawQR(c, \"card\"+k);\n    const iv = setInterval(()=>{ if(!document.body.contains(c)){ clearInterval(iv); return; } t--; if(t<=0){ t=30; k++; drawQR(c,\"card\"+k); } const el=root.querySelector(\"#qrTimer\"); if(el) el.lastChild.textContent = `обновится через ${t} с`; }, 1000);\n  });\n}\n\nfunction orderFields(c){\n  const id = c.id;\n  if(!c.app) return `<div class=\"field\"><label for=\"f-to-${id}\">Куда предоставить<\/label><select id=\"f-to-${id}\" name=\"to\">\n        ${(id===\"army\"?[\"Военный комиссариат\"]:[\"По месту требования\",\"Социальный фонд России\",\"Работа родителей\",\"Налоговая (вычет за обучение)\",\"Банк\",\"Визовый центр\"]).map(o=>`<option>${o}<\/option>`).join(\"\")}<\/select><\/div>\n      <div class=\"field\"><span class=\"lbl\">Формат<\/span><div class=\"radios\">\n        <label><input type=\"radio\" name=\"fmt\" value=\"e\" ${c.e?\"checked\":\"disabled\"}>Электронная<small>${c.e?\"с подписью вуза, сразу\":\"недоступна для этой справки\"}<\/small><\/label>\n        <label><input type=\"radio\" name=\"fmt\" value=\"p\" ${c.e?\"\":\"checked\"}>Бумажная<small>забрать в каб. 214-Б<\/small><\/label><\/div><\/div>\n      <div class=\"row\" style=\"gap:12px;flex-wrap:wrap\"><div class=\"field\" style=\"flex:1;min-width:120px\"><label for=\"f-n-${id}\">Количество<\/label><select id=\"f-n-${id}\">${[1,2,3,4,5].map(n=>`<option>${n}<\/option>`).join(\"\")}<\/select><\/div>\n        <div class=\"field\" style=\"flex:1;min-width:120px\"><label for=\"f-lang-${id}\">Язык<\/label><select id=\"f-lang-${id}\"><option>Русский<\/option>${c.en?\"<option>Английский<\/option>\":\"\"}<\/select><\/div><\/div>`;\n  return `<div class=\"field\"><label for=\"f-why-${id}\">Причина<\/label><textarea id=\"f-why-${id}\" name=\"why\" placeholder=\"Коротко опишите ситуацию\"><\/textarea><\/div>\n      <div class=\"field\"><label for=\"f-file-${id}\">Документы<\/label><input type=\"file\" id=\"f-file-${id}\" multiple style=\"padding:10px 14px;height:auto\"><span class=\"muted small\">PDF или фото, до 10 МБ каждый<\/span><\/div>`;\n}\nfunction submitOrder(f){\n  const c = CATALOG.find(x=>x.id===f.dataset.id);\n  if(c.app && !f.elements.why.value.trim()){ const er = f.querySelector(\".err\"); er.textContent = \"Опишите причину — без неё методист не сможет рассмотреть заявление.\"; er.hidden = false; f.elements.why.focus(); return; }\n  const fmt = f.querySelector('input[name=\"fmt\"]:checked'), isE = !!fmt && fmt.value === \"e\", to = f.elements.to, d = now();\n  const r = { id:`З-${String(d.getFullYear()).slice(2)}${String(d.getMonth()+1).padStart(2,\"0\")}-${String(Math.floor(600+Math.random()*399)).padStart(4,\"0\")}`,\n    t:c.t, sub: c.app ? \"Заявление · онлайн\" : `${to?to.value:\"\"} · ${isE?\"электронная\":\"бумажная\"}`,\n    step:0, date:d.toISOString().slice(0,10), doc:isE, purpose: to?to.value:\"\", info: c.app ? \"Передано методисту\" : isE ? \"Формируется и подписывается\" : `Будет готова: ${c.sla.toLowerCase()}` };\n  S.reqs.unshift(r); save(); closeSheet(true); go(\"requests\");\n  toast(c.app ? \"Заявление подано\" : \"Справка заказана\");\n  if(isE){\n    setTimeout(()=>{ r.step = 1; r.info = \"Подписывается электронной подписью\"; save(); if(S.view===\"requests\") render(); }, 1400);\n    setTimeout(()=>{ r.step = 2; r.info = \"Готова. Можно открыть и отправить\"; save(); if(S.view===\"requests\") render(); toast(\"Справка готова\"); }, 3400);\n  }\n}\n// заказ конкретной справки (поиск на главной, ссылка #docs:order): окно выбора с раскрытой формой\nfunction showOrder(id){\n  const c = CATALOG.find(x=>x.id===id); if(!c) return;\n  if(S.view!==\"requests\") go(\"requests\");\n  openPicker(c.app ? \"app\" : \"cert\", id);\n}\n\nfunction showDoc(id){\n  const r = S.reqs.find(x=>x.id===id); if(!r) return;\n  const code = id.replace(/\\D/g,\"\").slice(-6).replace(/(\\d{3})(\\d{3})/,\"$1-$2\");\n  openSheet(\"Справка об обучении\", `<div class=\"doc\">\n      <div class=\"dh\">Министерство науки и высшего образования<br>Университет · Институт информационных технологий<\/div>\n      <h3>СПРАВКА<\/h3>\n      <p>Выдана <b>${STUDENT.fio}<\/b> в том, что она действительно обучается на ${STUDENT.course} курсе по очной форме обучения за счёт бюджетных ассигнований по направлению подготовки ${STUDENT.program}.<\/p>\n      <p>Срок окончания обучения: 31 августа 2028 г.<br>Справка выдана для предоставления: ${esc(r.purpose||\"по месту требования\")}.<\/p>\n      <p style=\"font-size:12px;color:#666\">№ ${r.id} от ${fmtDate(new Date(r.date))} ${new Date(r.date).getFullYear()} г.<\/p>\n      <div class=\"sign\"><canvas id=\"docqr\" width=\"100\" height=\"100\" style=\"width:72px;height:72px\"><\/canvas><div>ДОКУМЕНТ ПОДПИСАН<br>ЭЛЕКТРОННОЙ ПОДПИСЬЮ<br><span style=\"color:#333\">Код проверки: <b class=\"mono\">${code}<\/b><\/span><\/div><\/div>\n    <\/div>\n    <p class=\"muted small\" style=\"margin-top:12px\">Это демонстрация: QR-узор и подпись условные. В рабочей версии получатель сканирует QR и видит оригинал на сайте вуза.<\/p>\n    <button class=\"btn block\" style=\"margin-top:12px\" data-action=\"copylink\" data-id=\"${r.id}\">Скопировать код проверки<\/button>`,\n    root => drawQR(root.querySelector(\"#docqr\"), r.id));\n}\n\n/* ===== события ===== */\ndocument.addEventListener(\"click\", e => {\n  const g = e.target.closest(\"[data-go]\");\n  if(g){ if(g.dataset.tab) S.inboxTab = g.dataset.tab; if(g.dataset.tab===\"chat\"){ S.chatId = \"dean\"; S.chatOpen = true; } if(g.closest(\"#sheetRoot\")) closeSheet(true); return; }\n  const a = e.target.closest(\"[data-action]\");\n  if(!a) return;\n  const act = a.dataset.action;\n  if(act===\"closesheet\"){ if(e.target===a || a.tagName===\"BUTTON\") closeSheet(); return; }\n  if(act===\"pref\") return;\n  switch(act){\n    case \"day\": S.day = +a.dataset.w; render(); break;\n    case \"gtab\": S.gradeTab = a.dataset.t; render(); break;\n    case \"sem\": S.sem = +a.dataset.n; render(); break;\n    case \"subj\": S.openSubj[a.dataset.i] = !S.openSubj[a.dataset.i]; render(); break;\n    case \"nf\": S.noteFilter = a.dataset.k; render(); break;\n    case \"itab\": S.inboxTab = a.dataset.t; render(); break;\n    case \"chat\": S.chatId = a.dataset.id; S.chatOpen = true; if(!S.chatRead.includes(S.chatId)) S.chatRead.push(S.chatId); save(); render();\n      if(innerWidth >= 760) document.getElementById(\"chatInput\")?.focus({preventScroll:true}); break;\n    case \"chatback\": S.chatOpen = false; render(); break;\n    case \"mskind\": S.msKind = a.dataset.k; render(); if(matchMedia(\"(hover: hover)\").matches) document.getElementById(\"msQ\")?.focus({preventScroll:true}); break;   // на телефоне клавиатура сама не выезжает\n    case \"person\": { const p = PEOPLE.find(x=>x.id===a.dataset.id);\n      if(!CHATS.some(c=>c.id===p.id)){ CHATS.unshift(personChat(p)); S.people.push(p.id); }\n      S.chatId = p.id; S.chatOpen = true; S.msQ = \"\"; S.msKind = \"chats\"; if(!S.chatRead.includes(p.id)) S.chatRead.push(p.id); save(); render();\n      if(innerWidth >= 760) document.getElementById(\"chatInput\")?.focus({preventScroll:true}); break; }\n    case \"evf\": S.evFilter = a.dataset.k; render(); break;\n    case \"evgo\": evToggle(a.dataset.id); if(a.dataset.sheet) closeSheet(true); if(S.view===\"inbox\") render(); break;\n    case \"evmore\": evMore(a.dataset.id); break;\n    case \"bgpick\": window.lkUI.set(\"bg\", a.dataset.v); render(); break;\n    case \"chatinfo\": { const c = CHATS.find(x=>x.id===S.chatId);\n      openSheet(c.n, `<div class=\"row\" style=\"margin-bottom:14px\"><span class=\"avatar\">${c.ini}<\/span><span class=\"grow muted small\">${esc(c.role)}<\/span><\/div>\n        <dl class=\"kv\" style=\"margin:0\">${c.info.map(([k,v])=>`<dt>${k}<\/dt><dd style=\"user-select:all;overflow-wrap:anywhere\">${esc(v)}<\/dd>`).join(\"\")}<\/dl>`); break; }\n    case \"docs\": go(\"requests\"); if(a.dataset.k) openPicker(a.dataset.k); break;\n    case \"pftab\": { S.infoTab = +a.dataset.i; document.querySelectorAll(\".pf-tabs button\").forEach((b,k)=>{ b.setAttribute(\"aria-pressed\", k===S.infoTab); b.setAttribute(\"aria-selected\", k===S.infoTab); });\n      const tr = document.getElementById(\"pfTrack\"); tr.scrollTo({left: S.infoTab*tr.clientWidth, behavior: matchMedia(\"(prefers-reduced-motion: reduce)\").matches ? \"auto\" : \"smooth\"}); break; }\n    case \"pfeye\": S.shown[a.dataset.k] = !S.shown[a.dataset.k]; render(); break;\n    case \"pfcopy\": { const k = a.dataset.k, p = PROFILE_INFO.find(p=>k.startsWith(p.id)), row = p.rows[+k.slice(p.id.length)];\n      const done = () => toast(`${row[0]}: скопировано`);\n      try{ navigator.clipboard.writeText(row[1]).then(done, done); }catch(err){ done(); } break; }\n    case \"readall\": S.read = DEFAULT_NOTES.map(n=>n.id); save(); render(); toast(\"Все уведомления прочитаны\"); break;\n    case \"note\": { const n = DEFAULT_NOTES.find(x=>x.id===a.dataset.id); if(!S.read.includes(n.id)) S.read.push(n.id); save(); if(n.go) go(n.go); else render(); break; }\n    case \"order\": showOrder(a.dataset.id); break;\n    case \"picker\": openPicker(a.dataset.k); break;\n    case \"gmopen\": gmToggle(a.dataset.id); break;\n    case \"doc\": showDoc(a.dataset.id); break;\n    case \"card\": showCard(); break;\n    case \"copylink\": { const code = a.dataset.id.replace(/\\D/g,\"\").slice(-6).replace(/(\\d{3})(\\d{3})/,\"$1-$2\");\n      const done = () => toast(`Код ${code} скопирован`);\n      try{ navigator.clipboard.writeText(code).then(done, ()=>toast(`Код проверки: ${code}`)); }catch(err){ toast(`Код проверки: ${code}`); } break; }\n    case \"topic\": { const inp = document.getElementById(\"chatInput\"); inp.value = `${a.dataset.t}: `; inp.focus(); break; }\n    case \"kill\": S.devices = S.devices.filter(d=>d.id!==a.dataset.id); save(); render(); toast(\"Сеанс завершён\"); break;\n    case \"logout\": window.lkLogout(); break;\n    case \"theme\": { window.lkUI.set(\"theme\", a.dataset.v); const sw = a.parentElement; sw.style.setProperty(\"--i\", THEMES.findIndex(t=>t[0]===a.dataset.v));\n      sw.querySelectorAll(\"button\").forEach(b=>b.setAttribute(\"aria-checked\", b===a)); break; }\n    case \"clockst\": window.lkUI.set(\"clock\", a.dataset.v); a.parentElement.querySelectorAll(\"button\").forEach(b=>b.setAttribute(\"aria-checked\", b===a)); toast(\"Стиль часов: \" + a.textContent.trim()); break;\n    case \"access\": go(\"access\"); break;\n    case \"dkmove\": { const cfg = window.lkUI.get().dock, i = cfg.findIndex(c=>c.id===a.dataset.id), j = i + +a.dataset.d;\n      if(j<0 || j>=cfg.length) break; [cfg[i], cfg[j]] = [cfg[j], cfg[i]]; window.lkUI.set(\"dock\", cfg); render();\n      document.querySelector(`.dk-row[data-id=\"${a.dataset.id}\"] [data-d=\"${a.dataset.d}\"]:not(:disabled)`)?.focus(); break; }\n    case \"dkicon\": { const cfg = window.lkUI.get().dock; cfg.find(c=>c.id===a.dataset.id).ic = +a.dataset.n; window.lkUI.set(\"dock\", cfg); render(); break; }\n    case \"dkreset\": window.lkUI.set(\"dock\", null); render(); toast(\"Док вернулся к исходному виду\"); break;\n  }\n}, true);\ndocument.addEventListener(\"change\", e => {\n  const t = e.target;\n  if(t.id === \"bgFile\" && t.files[0]){\n    window.lkUI.setPhoto(t.files[0]).then(kept => { if(S.view===\"settings\") render(); toast(kept ? \"Фон обновлён\" : \"Фото большое: фон сохранится только до перезагрузки\"); }, () => toast(\"Не получилось открыть изображение\"));\n    return;\n  }\n  if(t.id === \"chatFile\" && t.files[0]){ const f = t.files[0]; sendChat({me:true, t:\"\", file:`${f.name} · ${Math.max(1, Math.round(f.size/1024))} КБ`, w:stamp()}); return; }\n  if(t.dataset && t.dataset.action===\"pref\"){\n    const k = t.dataset.k;\n    if(k===\"tfa\"){ S.tfa = t.checked; toast(t.checked ? \"Код подтверждения включён\" : \"Код подтверждения выключен\"); }\n    else { S.prefs[k] = t.checked; }\n    save();\n  }\n  if(t.dataset && t.dataset.action===\"uipref\") window.lkUI.set(t.dataset.k, t.checked);\n  if(t.dataset && t.dataset.action===\"dkon\"){ const cfg = window.lkUI.get().dock; cfg.find(c=>c.id===t.dataset.k).on = t.checked; window.lkUI.set(\"dock\", cfg); render(); }\n});\ndocument.addEventListener(\"input\", e => {\n  if(e.target.id === \"gmQ\"){\n    const q = e.target.value.trim().toLowerCase(), its = [...document.querySelectorAll(\"#gmList .gm-it\")];\n    let n = 0; its.forEach(it => { const hit = !q || q.split(/\\s+/).every(w => it.dataset.k.includes(w)); it.hidden = !hit; if(hit) n++; });\n    document.querySelector(\"#gmList .gm-empty\").hidden = n > 0;\n    if(n === 1 && q.length > 2) gmToggle(its.find(it=>!it.hidden).dataset.id, true);\n    return;\n  }\n  if(e.target.id === \"msQ\"){ S.msQ = e.target.value; document.getElementById(\"msItems\").innerHTML = msItems(); return; }\n  if(e.target.id !== \"glassRng\") return;\n  const v = +e.target.value; e.target.style.setProperty(\"--v\", v + \"%\");\n  document.getElementById(\"glassVal\").textContent = v + \"%\";\n  window.lkUI.set(\"glass\", v);\n});\ndocument.addEventListener(\"submit\", e => {\n  if(e.target.classList.contains(\"gm-form\")){ e.preventDefault(); submitOrder(e.target); return; }\n  if(e.target.id !== \"composer\") return;\n  e.preventDefault();\n  const inp = document.getElementById(\"chatInput\"), v = inp.value.trim();\n  if(!v) return;\n  sendChat({me:true, t:v, w:stamp()});\n  document.getElementById(\"chatInput\")?.focus({preventScroll:true});\n});\ndocument.addEventListener(\"keydown\", e => {\n  if(e.key===\"Escape\") closeSheet();\n  if((e.key===\"Enter\" || e.key===\" \") && e.target.classList?.contains(\"bg-up\")){ e.preventDefault(); e.target.querySelector(\"input\").click(); }\n});\n})();\n<\/script>\n<\/body>\n<\/html>\n";</script>
<script>
  const SCREENS = [
